name: Build SKT Takip APK

on:
  push:
    branches: [ "main", "master", "ana", "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Prepare Keystore and Environment Files
      run: |
        if [ -f "debug.keystore.base64" ]; then
          echo "Restoring debug.keystore from base64..."
          base64 -d debug.keystore.base64 > debug.keystore
        fi
        if [ ! -f ".env" ] && [ -f ".env.example" ]; then
          echo "Creating .env from .env.example..."
          cp .env.example .env
        elif [ ! -f ".env" ]; then
          touch .env
        fi

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Licenses and Install Components
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "platforms;android-35" "build-tools;35.0.0"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.13'

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon --stacktrace -Dorg.gradle.configuration-cache=false

    - name: Rename APK for Easy Identification
      run: |
        mkdir -p release_apk
        find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} release_apk/SKT_Takip_App.apk \;

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SKT-Takip-APK
        path: release_apk/*.apk
        retention-days: 30

    - name: Create or Update GitHub Release with APK
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/ana' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
      with:
        tag_name: latest-build
        name: "SKT Takip Son APK Sürümü"
        body: |
          🚀 **SKT & Ürün Takip Uygulaması Güncel APK Dosyası**
          
          - Otomatik derlenen en güncel APK dosyası eklendi.
          - Aşağıdaki `SKT_Takip_App.apk` dosyasına dokunarak telefonunuza indirip hemen kurabilirsiniz.
        draft: false
        prerelease: false
        files: release_apk/SKT_Takip_App.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


